# HA Auto Updater — Standalone "Run Updates Now" Button (v1.2.0)
#
# A single tap-to-run button with a confirmation prompt, styled to match
# the built-in HA "button" card. No HACS frontend cards required.
# To add: Settings → Dashboards → Edit Dashboard → Add Card → "Manual" (YAML) → paste this in.

type: button
entity: button.ha_auto_updater_run_updates_now
name: Run Updates Now
icon: mdi:update
show_state: false
tap_action:
  action: perform-action
  perform_action: button.press
  target:
    entity_id: button.ha_auto_updater_run_updates_now
  confirmation:
    text: Run all available updates now?
